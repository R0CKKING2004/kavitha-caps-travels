<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Package - Kavitha CAPS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .header {
            background: #172554;
            color: white;
            padding: 20px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 7px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .back {
            background: #64748b;
            color: white;
        }

        .container {
            max-width: 800px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .card h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #cbd5e1;
            border-radius: 7px;

            font-size: 14px;
            font-family: Arial;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .required {
            color: #dc2626;
        }

        .image-box {
            border: 2px dashed #cbd5e1;
            padding: 25px;
            text-align: center;
            border-radius: 8px;
        }

        .image-box input {
            border: none;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .save {
            background: #2563eb;
            color: white;
        }

        .cancel {
            background: #64748b;
            color: white;
        }

        .preview {
            max-width: 250px;
            max-height: 180px;
            margin-top: 15px;
            display: none;
            border-radius: 8px;
        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h2>
        KAVITHA CAPS
    </h2>

    <a
        href="{% url 'erp_packages' %}"
        class="btn back"
    >
        ← Packages
    </a>

</div>


<!-- FORM -->

<div class="container">

    <div class="card">

        <h1>
            Add Travel Package
        </h1>

        <p class="subtitle">
            Create a new package for your customers.
        </p>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Package Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Example: Kodaikanal 3 Days Package"
                    required
                >

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label>
                    Location
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="location"
                    placeholder="Example: Kodaikanal"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description
                    <span class="required">*</span>
                </label>

                <textarea
                    name="description"
                    placeholder="Enter package details..."
                    required
                ></textarea>

            </div>


            <!-- PRICE -->

            <div class="form-group">

                <label>
                    Package Price
                    <span class="required">*</span>
                </label>

                <input
                    type="number"
                    name="price"
                    placeholder="Example: 15000"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <!-- DURATION -->

            <div class="form-group">

                <label>
                    Duration
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="duration"
                    placeholder="Example: 3 Days / 2 Nights"
                    required
                >

            </div>


            <!-- IMAGE -->

            <div class="form-group">

                <label>
                    Package Image
                </label>

                <div class="image-box">

                    <p>
                        Select package image
                    </p>

                    <input
                        type="file"
                        name="image"
                        id="imageInput"
                        accept="image/*"
                        onchange="previewImage(event)"
                    >

                    <br>

                    <img
                        id="imagePreview"
                        class="preview"
                    >

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    class="btn save"
                >
                    💾 Save Package
                </button>


                <a
                    href="{% url 'erp_packages' %}"
                    class="btn cancel"
                >
                    Cancel
                </a>

            </div>


        </form>

    </div>

</div>


<script>

function previewImage(event) {

    const image =
        document.getElementById(
            "imagePreview"
        );

    image.src =
        URL.createObjectURL(
            event.target.files[0]
        );

    image.style.display = "block";
}

</script>


</body>

</html>
