<!DOCTYPE html>
<html>

<head>

    <title>Delete Package</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .box {
            width: 450px;
            max-width: 90%;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
        }

        button,
        a {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            background: #dc2626;
            color: white;
        }

        .cancel {
            background: #64748b;
            color: white;
        }

    </style>

</head>


<body>


<div class="box">

    <h2>
        Delete Package?
    </h2>

    <p>
        Are you sure you want to delete
        <strong>{{ package.name }}</strong>?
    </p>


    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a
            href="{% url 'erp_packages' %}"
            class="cancel"
        >
            Cancel
        </a>

    </form>

</div>


</body>

</html>
